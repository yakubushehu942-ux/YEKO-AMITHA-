<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YEKO AMITHA — Admin</title><link rel="stylesheet" href="/public/css/style.css"><script src="/public/js/firebase-config.js"></script><script type="module" src="/public/js/admin.js"></script></head>
